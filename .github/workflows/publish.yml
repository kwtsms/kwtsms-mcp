# FILE:    .github/workflows/publish.yml
# CREATED: 2026-11-08 17:10 +03
# WHAT:    On a v* tag: tests, npm publish with provenance (trusted publishing, no token), GitHub release with the
#          CHANGELOG section, then server.json to the official MCP Registry (mcp-publisher, GitHub OIDC).
name: Publish to npm
# 2026-11-09 08:49 +03: workflow_dispatch to finish a release whose tag run stopped part way (0.1.0: npm took the
#          version, the MCP Registry asked before npm served it); every step now skips what is already done.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to finish publishing, for example v0.1.0'
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # 2026-11-09 10:36 +03: no dependency cache in release builds (npm trusted publishing guide)
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - name: Version matches the tag
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      # 2026-11-09 10:36 +03: npm trusted publishing (OIDC) only; the one-time NPM_TOKEN secret was deleted after 0.1.1
      - name: npm publish (skipped when npm already has this version)
        run: |
          V="${TAG#v}"
          if npm view "kwtsms-mcp@$V" version >/dev/null 2>&1; then echo "npm already has $V"; exit 0; fi
          npm publish --access public --provenance --ignore-scripts
      - name: Wait until npm serves the version (the MCP Registry checks npm)
        run: |
          V="${TAG#v}"
          for i in $(seq 1 40); do npm view "kwtsms-mcp@$V" version >/dev/null 2>&1 && exit 0; sleep 15; done
          echo "npm does not serve $V after 10 minutes"; exit 1
      - name: Publish to the MCP Registry (GitHub OIDC, no secret)
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: GitHub release with the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          awk "/^## \\[${V}\\]/{f=1; next} /^## \\[/{if(f) exit} f{print}" CHANGELOG.md > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --latest --notes-file /tmp/notes.md
      # 2026-11-09 10:07 +03: Claude Desktop bundle attached to the release (from a clean copy with production dependencies only)
      - name: Claude Desktop bundle (.mcpb) on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx kwtsms-mcp.mcpb; then echo "bundle already attached"; exit 0; fi
          mkdir /tmp/b && git archive HEAD | tar x -C /tmp/b
          (cd /tmp/b && npm ci --omit=dev --ignore-scripts && npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json && npx -y @anthropic-ai/mcpb@2.1.2 pack . /tmp/kwtsms-mcp.mcpb)
          gh release upload "$TAG" /tmp/kwtsms-mcp.mcpb
